# Master compose file — one service per game (see CLAUDE.md §4).
# Add/update a service every time a game is created, renamed, or removed.
#
# Multiplayer server (add when the first game needs it):
#   server:
#     build:
#       context: .
#       dockerfile: server/Dockerfile
#     ports:
#       - "3000:3000"

services:
  super-flynn-bros:
    build:
      context: .
      dockerfile: super-flynn-bros/Dockerfile
    ports:
      - "8001:80"
    restart: unless-stopped

  # The front door: http://localhost:8000 (forwards /<game-id>/ to each game).
  arcade:
    build:
      context: .
      dockerfile: arcade/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - super-flynn-bros
    restart: unless-stopped
