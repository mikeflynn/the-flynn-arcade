# Production add-on for a web server that already runs Caddy (or another web
# server) on the host. Use it together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes:
#   - The arcade listens on 127.0.0.1 only (port 8000 by default), so just the
#     server itself (your Caddy) can reach it, not the whole internet.
#   - The games' own ports are hidden. Visitors reach every game through the
#     arcade, which forwards /<game-id>/ to each game's container.
#
# Then point your Caddy at it (see deploy/Caddyfile.example):
#   arcade.yourdomain.com {
#       reverse_proxy localhost:8000
#   }
#
# To use a different port, set ARCADE_PORT in a .env file (see .env.example).
# Needs Docker Compose 2.24 or newer (for "!override" and "!reset").

services:
  arcade:
    ports: !override
      - "127.0.0.1:${ARCADE_PORT:-8000}:80"

  # When you add a game, give it the same "ports: !reset []" block here.
  super-flynn-bros:
    ports: !reset []
