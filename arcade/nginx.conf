server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Redirects keep whatever address and port you used (e.g. localhost:8000).
  absolute_redirect off;

  # Look up each game's container when someone visits, not just once when the
  # arcade starts. That way rebuilding or stopping one game never breaks the
  # arcade (a stopped game just shows an error on its own page).
  # 127.0.0.11 is Docker's built-in address book.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 🕹️ One block per game: /<game-id>/ is passed to that game's own container.
  # Add a block like this whenever a new game joins the arcade (see CLAUDE.md),
  # changing "super-flynn-bros" in all four places.
  location = /super-flynn-bros { return 301 /super-flynn-bros/; }
  location /super-flynn-bros/ {
    set $game http://super-flynn-bros:80;
    rewrite ^/super-flynn-bros/(.*)$ /$1 break;
    proxy_pass $game;
  }

  # The arcade itself. Missing files are real 404s, so optional sounds are skipped.
  location / {
    try_files $uri $uri/ =404;
  }
}
